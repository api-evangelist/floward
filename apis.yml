aid: floward
name: Floward
description: >-
  Floward is a leading online flowers and luxury gifting company headquartered
  in Kuwait and operating across the Middle East and the United Kingdom. Founded
  in 2017, the company delivers fresh flower arrangements, curated gift boxes,
  chocolates, cakes, and personalized gifts to more than 40 cities across 9
  countries, sourcing blooms daily from ethical growers worldwide and offering
  same-day and scheduled delivery through its web store and mobile apps. Floward
  is backed by investors including 500 Global. This API Evangelist profile tracks
  Floward as a company in the network; as of this enrichment pass the company
  publishes a consumer e-commerce storefront and corporate site but no public
  developer API, documentation portal, or SDKs were found.
